name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build with Gradle
      run: ./gradlew assembleRelease

    - name: Sign APK
      run: |
        # 生成调试密钥
        keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=Android Debug,O=Android,C=US"
        
        # 找到生成的 APK
        APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
        echo "Found APK: $APK_FILE"
        
        # 使用 jarsigner 签名（Java 自带工具）
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
          -keystore debug.keystore -storepass android -keypass android \
          "$APK_FILE" androiddebugkey
        
        # 验证签名
        jarsigner -verify -verbose "$APK_FILE"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ForestGameCenterFix-release
        path: app/build/outputs/apk/release/*.apk
